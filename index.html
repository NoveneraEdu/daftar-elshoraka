<!DOCTYPE html>

<head>

<style>
/* Layout: phone-first ledger — sticky header, label-over-figure cells, bottom tabs, bottom-sheet forms */
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --sunk:#E2E8E5; --line:#D3DBD7;
  --ink:#14211C; --muted:#5E6C66; --accent:#17473E; --accent-2:#2E7D6B; --accent-ink:#FFFFFF;
  --good:#1E7A4C; --good-bg:#DCF1E5; --warn:#94600A; --warn-bg:#FAEED3; --bad:#B23A35; --bad-bg:#F8E0DE;
  --wa:#1FA855; --hero:#17473E; --hero-ink:#FFFFFF;
  --nov:#4655C4; --cen:#13808A; --nab:#C24A3A; --pvt:#8A5A1E;
  --f:'Alexandria',system-ui,'Segoe UI',Tahoma,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#17201C; --sunk:#111816; --line:#29342F;
  --ink:#E6EEEA; --muted:#93A39C; --accent:#5BB8A4; --accent-2:#5BB8A4; --accent-ink:#0B1714;
  --good:#5FCB92; --good-bg:#15302A; --warn:#E3B04F; --warn-bg:#33291A; --bad:#EE7C74; --bad-bg:#3A1F1E;
  --wa:#3FD07A; --hero:#1D3B34; --hero-ink:#E6EEEA; --nov:#8E9BF0; --cen:#4FC3CC; --nab:#F08A78; --pvt:#D9A55E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#17201C; --sunk:#111816; --line:#29342F;
  --ink:#E6EEEA; --muted:#93A39C; --accent:#5BB8A4; --accent-2:#5BB8A4; --accent-ink:#0B1714;
  --good:#5FCB92; --good-bg:#15302A; --warn:#E3B04F; --warn-bg:#33291A; --bad:#EE7C74; --bad-bg:#3A1F1E;
  --wa:#3FD07A; --hero:#1D3B34; --hero-ink:#E6EEEA; --nov:#8E9BF0; --cen:#4FC3CC; --nab:#F08A78; --pvt:#D9A55E; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);direction:rtl;margin:0}
body{color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.cur{font-size:.72em;color:var(--muted);font-weight:400;margin-inline-start:3px}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,label:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}

.app{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;flex-shrink:0;display:block}
.logo.lg{width:58px;height:58px}
.brand h1{font-weight:700;font-size:21px;margin:0;line-height:1.15}
.brand p{margin:0;color:var(--muted);font-size:12px}
.hdr-tools{display:flex;align-items:center;gap:6px}
.status{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.dot.ok{background:var(--good)}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:12px;display:grid;place-items:center;padding:0;flex-shrink:0}
.icon-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}

.pane{display:flex;flex-direction:column;gap:16px;padding-block:16px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-h h2{font-weight:600;font-size:16px;margin:0}
.sec-h small{color:var(--muted);font-size:12.5px}
.hint{color:var(--muted);font-size:12.5px;margin:0}

.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:3px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;border:0;background:none;padding:7px 10px;border-radius:9px;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12.5px;white-space:nowrap;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}

.hero{background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:18px;display:grid;gap:14px}
.hero .lbl{opacity:.75;font-size:13px}
.hero .big{font-size:34px;font-weight:700;line-height:1.1;display:flex;align-items:baseline;gap:4px}
.hero .cur{color:var(--hero-ink);opacity:.7}
.hero .trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px solid rgba(255,255,255,.18);padding-top:12px}
.hero .trio>div{min-width:0}
.hero .trio>div>span{display:block;opacity:.72;font-size:11.5px;margin-bottom:2px}
.hero .trio b{font-weight:600;font-size:16px;white-space:nowrap}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cells{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line)}
.cells>div{background:var(--surface);padding:10px 14px;min-width:0}
.cells>div>span{display:block;color:var(--muted);font-size:12px}
.cells>div>span em{font-style:normal;opacity:.8}
.cells b{font-weight:600;font-size:16px}
.cells .co b{color:var(--muted)}
.ent-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.ent-h i{width:10px;height:28px;border-radius:4px;background:var(--c);flex-shrink:0}
.ent-h div{min-width:0}
.ent-h h3{margin:0;font-size:17px;font-weight:700;line-height:1.2}
.ent-h small{color:var(--muted);font-size:12px}
.ent-h b{font-weight:600}

.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .tap{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;text-align:right}
.row .tap:active{opacity:.7}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:15px}
.row .s{color:var(--muted);font-size:12.5px;margin-top:1px}
.row .amt{text-align:left;flex-shrink:0;display:grid;justify-items:end;gap:3px}
.row .amt b{font-weight:600}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.chip{font-size:11px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.e{color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.wa-btn{flex-shrink:0;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--wa) 14%,transparent);color:var(--wa);text-decoration:none;border:0}
.wa-btn svg{width:20px;height:20px;fill:currentColor}
.check{flex-shrink:0;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:none;display:grid;place-items:center;padding:0}
.check.on{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
.check svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:3}

.ch{padding:14px 16px 8px}
.ch h2{margin:0;font-size:16px;font-weight:600}
.ch p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.wl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 16px;border-top:1px solid var(--line);font-size:14px}
.wl>span{min-width:0}
.wl>span small{display:block;color:var(--muted);font-size:11.5px}
.wl b{font-weight:600;white-space:nowrap}
.wl.sub>span{padding-inline-start:14px;color:var(--muted)}
.wl.tot{background:var(--sunk);font-weight:700}
.wl.tot b{font-size:16px}
.wl.neg b{color:var(--bad)}
.wl.pos b{color:var(--good)}
.note{padding:10px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);line-height:1.7}
.note.bad{background:var(--bad-bg);color:var(--bad)}
.note.good{background:var(--good-bg);color:var(--good)}
.pblk{border-top:1px solid var(--line)}
.pblk .lbl{padding:10px 16px 0;font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.pblk .lbl small{font-weight:400;color:var(--muted)}
.cells.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.pblk .cells{margin-top:8px;border-top:1px solid var(--line)}
.empty{padding:24px 18px;text-align:center;color:var(--muted);font-size:13.5px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px;font-weight:600}
.alert{border-radius:12px;padding:10px 14px;font-size:13px;background:var(--warn-bg);color:var(--warn)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;flex-shrink:0}
.search input{border:0;background:none;font:inherit;font-size:15px;color:var(--ink);padding:10px 0;width:100%;outline:none}

.pcard .head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px}
.pcard h3{margin:0;font-size:17px;font-weight:600}
.pcard .head small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.pcard .bal{display:grid;justify-items:end;flex-shrink:0}
.pcard .bal small{color:var(--muted);font-size:11.5px}
.pcard .bal b{font-size:20px;font-weight:700}
.pcard .foot{display:flex;gap:8px;padding:10px 16px 14px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.dan{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:10px}
.btn svg{width:16px;height:16px;fill:currentColor}
.btn[disabled]{opacity:.6}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools.col{flex-direction:column}

nav.tabs{position:fixed;bottom:0;inset-inline:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:none;padding:8px 2px 9px;display:grid;justify-items:center;gap:1px;font-size:11px;color:var(--muted);position:relative}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-current="page"]{color:var(--accent-2);font-weight:600}
.badge{position:absolute;top:4px;inset-inline-end:calc(50% - 20px);background:var(--bad);color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px;font-weight:600}
.fab{position:fixed;z-index:6;bottom:calc(72px + env(safe-area-inset-bottom,0px));left:max(16px,calc(50% - 364px));border:0;background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:12px 18px;font-weight:600;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.2);display:flex;align-items:center;gap:6px}

.scrim{position:fixed;inset:0;z-index:20;background:rgba(8,14,12,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;animation:up .2s ease}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.sheet h3{font-size:19px;font-weight:700;margin:0 0 4px}
.sheet .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.fields{display:grid;gap:12px}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.group{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:12px}
.group>.gh{font-size:13px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:8px;margin:0}
.group>.gh small{font-weight:400;color:var(--muted)}
label.fl{display:grid;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
label.fl input,label.fl select,label.fl textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
label.fl textarea{min-height:150px;resize:vertical;font-size:14px;line-height:1.7}
label.cb{display:flex;align-items:center;gap:8px;font-size:14px}
label.cb input{width:20px;height:20px;accent-color:var(--accent-2)}
.kindpick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.kindpick button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 4px;display:grid;justify-items:center;gap:4px;font-size:12.5px;color:var(--muted)}
.kindpick button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.kindpick button[aria-pressed="true"]{border-color:var(--accent-2);background:color-mix(in srgb,var(--accent-2) 12%,var(--surface));color:var(--ink);font-weight:600}
.calc{background:var(--sunk);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:baseline;font-size:14px;gap:8px}
.acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.acts .grow{flex:1}
.confirm{display:flex;gap:8px;align-items:center;background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:8px 10px;font-size:13.5px;flex-wrap:wrap;width:100%}
.confirm span{flex:1}
.mini{display:grid;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:6px}
.mini .r{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13.5px;align-items:center}
.mini .r:last-child{border-bottom:0}
.mini .r small{color:var(--muted)}
.mini .r .tools{flex-shrink:0;gap:6px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.kv>div{background:var(--sunk);border-radius:12px;padding:9px 12px;min-width:0}
.kv>div>span{display:block;color:var(--muted);font-size:11.5px}
.kv b{font-weight:600;font-size:15px}
.nov{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.nov .nh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.nov .nh b{font-size:13px}.nov .nh small{color:var(--muted);font-size:11.5px}
.nov .n3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.nov .n3>div{background:var(--sunk);border-radius:10px;padding:7px 10px;min-width:0}
.nov .n3 span{display:block;color:var(--muted);font-size:11px}.nov .n3 b{font-size:16px;font-weight:600}
.nov .n3 .act{background:var(--accent);color:var(--accent-ink)}.nov .n3 .act span{color:inherit;opacity:.85}
.nov .nf{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;color:var(--muted);font-size:12px}
.preview{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;margin-bottom:12px;max-height:46vh;overflow-y:auto}
.preview img{display:block;width:100%}
.logo-edit{display:flex;align-items:center;gap:12px}
.logo-box{width:56px;height:56px;border-radius:12px;background:var(--sunk) center/contain no-repeat;flex-shrink:0;display:grid;place-items:center;color:#fff;font-weight:700;font-size:22px}
.toast{position:fixed;z-index:30;bottom:calc(140px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;white-space:nowrap}

.auth{min-height:100vh;display:grid;place-items:center;padding-inline:16px}
.auth form{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px 20px;width:100%;max-width:380px;display:grid;gap:14px}
.auth h1{font-size:26px;margin:0;font-weight:700}
.auth p{margin:0;color:var(--muted);font-size:13px}
#authMsg{min-height:1.4em;color:var(--warn)}

</style>
<style id="docCss">
/* ===== printable documents (always light paper, fixed A4 at 96dpi) ===== */
.doc-host,.doc-host *,.doc,.doc *{box-sizing:border-box}
.doc-host{position:fixed;left:-12000px;top:0;width:794px;direction:rtl;z-index:-1}
.doc{width:794px;height:1123px;background:#FFFFFF;color:#1A2320;font-family:'Alexandria',Tahoma,sans-serif;position:relative;padding:58px 56px 0;overflow:hidden;font-size:12.5px;line-height:1.65;direction:rtl}
.doc .band{position:absolute;top:0;left:0;right:0;height:10px;background:var(--brand)}
.doc .num{direction:ltr;unicode-bidi:isolate;display:inline-block}
.d-head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;padding-bottom:22px;border-bottom:2px solid #E6EAE8}
.d-brand{display:flex;gap:14px;align-items:center}
.d-logo{width:66px;height:66px;border-radius:16px;background-position:center;background-size:contain;background-repeat:no-repeat;flex-shrink:0}
.d-mono{width:66px;height:66px;border-radius:16px;background:var(--brand);color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;flex-shrink:0}
.d-brand h1{margin:0;font-size:23px;font-weight:700;color:var(--brand);line-height:1.3}
.d-brand p{margin:0;color:#66726D;font-size:11.5px;line-height:1.6}
.d-title{text-align:left;min-width:200px}
.d-title h2{margin:0 0 6px;font-size:28px;font-weight:700;color:#1A2320;line-height:1.2}
.d-meta{display:grid;gap:2px;font-size:12px;color:#4C5753}
.d-meta div{display:flex;justify-content:space-between;gap:16px}
.d-meta b{color:#1A2320;font-weight:600}
.d-parties{display:flex;gap:16px;margin:24px 0 20px}
.d-box{flex:1;background:#F5F7F6;border-radius:12px;padding:14px 16px}
.d-box .lbl{font-size:11px;color:#7A8581;margin-bottom:4px}
.d-box .nm{font-size:16px;font-weight:700;color:#1A2320;line-height:1.4}
.d-box .ln{font-size:12px;color:#4C5753}
.d-table{width:100%;border-collapse:collapse;font-size:12.5px}
.d-table th{background:var(--brand);color:#FFFFFF;font-weight:600;text-align:right;padding:10px 12px;font-size:12px}
.d-table th:first-child{border-radius:0 10px 10px 0}

<script>
/* ================= business rules ================= */
const PARTNERS = {fathy:'محمود فتحي', adel:'محمود عادل', arafa:'عرفة', sory:'سوري'};

/* the three teachers from before the company belong to Fathy & Adel only — kept completely outside the company books */
const PVT = {name:'الحساب الخاص', full:'الحساب الخاص · فتحي وعادل', c:'var(--pvt)', hex:'#8A5A1E'};

const bkey = e => ENTS[e] ? e : 'nov';   // invoices for the private teachers carry Novenera's name
const GROUP_HEX = '#17473E';
const ICONS = {

  doctor:'<svg viewBox="0 0 24 24"><path d="M6 3v6a4 4 0 0 0 8 0V3M10 13v2a5 5 0 0 0 10 0v-2"/><circle cx="20" cy="11" r="2"/></svg>',

};
/* each client type has its own details, billing options and unit */
const KIND_CFG = {
  teacher:{label:'مدرس', plural:'مدرسين', unit:'طالب', units:'طلاب', billings:['per_student','fixed'], namePh:'مثلاً: أ. محمد علي',
    fields:[{k:'subject',l:'المادة',ph:'مثلاً: فيزياء'},{k:'stage',l:'المرحلة',opts:['','ابتدائي','إعدادي','ثانوي','جامعي','أخرى']}]},
  center:{label:'سنتر', plural:'سناتر', unit:'مدرس', units:'مدرسين', billings:['fixed','per_student'], namePh:'مثلاً: سنتر النور',
    fields:[{k:'contact',l:'اسم المسؤول',ph:'مثلاً: أ. أحمد'},{k:'address',l:'المنطقة / العنوان',ph:'مثلاً: المعادي'}]},
  doctor:{label:'دكتور', plural:'دكاترة', unit:null, units:null, billings:['fixed'], namePh:'مثلاً: د. سارة أحمد',
    fields:[{k:'specialty',l:'التخصص',ph:'مثلاً: أسنان'},{k:'clinic',l:'العيادة / المكان',ph:'مثلاً: عيادة مدينة نصر'}]},
  other:{label:'عميل', plural:'أخرى', unit:'وحدة', units:'وحدات', billings:['fixed','per_student'], namePh:'اسم العميل أو النشاط',
    fields:[{k:'activity',l:'النشاط',ph:'مثلاً: صيدلية'}]},
};
const KINDS = Object.fromEntries(Object.entries(KIND_CFG).map(([k,v])=>[k,v.label]));
const KINDS_PL = {all:'الكل', ...Object.fromEntries(Object.entries(KIND_CFG).map(([k,v])=>[k,v.plural]))};
const SERVICES = ['منصة تعليمية','شات بوت واتساب','سيستم حجز مواعيد','سيستم إدارة','تصميم وإعلانات'];
const CYCLES = {weekly:'أسبوعي', monthly:'شهري', once:'مرة واحدة'};
const SUB_CYCLES = {monthly:'شهري', quarterly:'كل 3 شهور', yearly:'سنوي'};
const COMM_TYPES = {recurring_percent:'نسبة من كل دفعة', once_percent:'نسبة من أول دفعة بس', once_fixed:'مبلغ ثابت مرة واحدة'};
const CATS = ['اشتراكات وأدوات','إعلانات','إنترنت ومعدات','رواتب ومكافآت','أخرى'];
const COLS = ['clients','payments','incomes','expenses','payouts','subscriptions','tasks','reps','rep_payouts','transfers','settings'];
const DEFAULT_TPL = {
  remind:
`*{الكيان}*
━━━━━━━━━━━━
*تذكير بموعد السداد*

السيد/ة {الاسم}،
تحية طيبة وبعد،

نود تذكير سيادتكم بموعد سداد الاشتراك {الفترة}:

▪️ الخدمة: {الخدمة}
▪️ المبلغ: *{المبلغ} ج.م*
▪️ تاريخ الاستحقاق: *{التاريخ}*

نشكر لكم حسن تعاونكم، ونحن في خدمتكم لأي استفسار.

مع خالص التحية،
إدارة {الكيان}`,
  late:
`*{الكيان}*
━━━━━━━━━━━━
*إشعار بمبلغ مستحق*

السيد/ة {الاسم}،
تحية طيبة وبعد،

نحيط سيادتكم علماً بوجود مبلغ مستحق لم يتم سداده حتى الآن:

▪️ الخدمة: {الخدمة}
▪️ المبلغ المستحق: *{المبلغ} ج.م*
▪️ تاريخ الاستحقاق: {التاريخ} (منذ {أيام_التأخير} يوم)

نرجو التكرم بالسداد في أقرب وقت ممكن. وفي حال تم السداد بالفعل، يُرجى تجاهل هذه الرسالة.

مع خالص التحية،
إدارة {الكيان}`,
  receipt:
`*{الكيان}*
━━━━━━━━━━━━
*تأكيد استلام دفعة* ✅

السيد/ة {الاسم}،

نؤكد استلام مبلغ *{المبلغ} ج.م* بتاريخ {التاريخ}.
رقم الفاتورة: {رقم_الفاتورة}

مرفق لسيادتكم الفاتورة. نشكركم على ثقتكم.

إدارة {الكيان}`,
  statement:
`*{الكيان}*
━━━━━━━━━━━━
*كشف حساب*

السيد/ة {الاسم}،
تحية طيبة وبعد،

مرفق لسيادتكم كشف الحساب عن الفترة: {الفترة}.
▪️ الرصيد: *{المبلغ} ج.م*

لأي استفسار نحن في خدمتكم.

مع خالص التحية،
إدارة {الكيان}`,
};
const TPL_VARS = '{الاسم} {المبلغ} {التاريخ} {الكيان} {الفترة} {الخدمة} {رقم_الفاتورة} {أيام_التأخير}';

/* ================= storage (Supabase) ================= */
const SB_URL = 'https://vvlkdvxmltogjewylfnl.supabase.co';
const SB_KEY = 'sb_publishable_9I8zteMYphRkwC1P1qT85w_xupG6YHv';
const sb = window.supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:true, autoRefreshToken:true}});
const S = Object.fromEntries(COLS.map(c=>[c,[]]));
let mode='loading', tab='home', period='month', cliSeg='all', cliKind='all', cliQ='', expSeg='all', dateSeg='subs', teamSeg='partners';
try{ const t = localStorage.getItem('tab'); if(t && !['income','partners'].includes(t)) tab = t; }catch(e){}
const LS_KEY = 'sahm-cache-v3';
function cacheLoad(){ try{ const d = JSON.parse(localStorage.getItem(LS_KEY)||'{}'); COLS.forEach(c=>S[c]=d[c]||[]); }catch(e){} }
function cacheSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

const MAP = {desc:'description', paidBy:'paid_by', createdAt:'created_at', fixedAmount:'fixed_amount', nextDue:'next_due',
  clientId:'client_id', nextDate:'next_date', remindDays:'remind_days', dueDate:'due_date', dueTime:'due_time',
  repId:'rep_id', commissionType:'commission_type', commissionValue:'commission_value', commissionMonths:'commission_months', invoiceNo:'invoice_no',
  noveneraTeacherId:'novenera_teacher_id', onlinePrice:'online_price', novCounts:'nov_counts'};
const RMAP = Object.fromEntries(Object.entries(MAP).map(([a,b])=>[b,a]));
const NUMS = new Set(['price','amount','collected','fixed_amount','students','remind_days','commission_value','commission_months','invoice_no','online_price']);
const toRow = o => Object.fromEntries(Object.entries(o).filter(([k])=>!k.startsWith('_')).map(([k,v])=>[MAP[k]||k, v===''?null:v]));
const fromRow = o => Object.fromEntries(Object.entries(o).map(([k,v])=>[RMAP[k]||k, NUMS.has(k)&&v!==null?Number(v):v]));

async function loadAll(){
  try{
    const res = await Promise.all(COLS.map(c=>sb.from(c).select('*')));
    const bad = res.find(r=>r.error); if(bad) throw bad.error;
    COLS.forEach((c,i)=>S[c] = res[i].data.map(fromRow));
    mode='db'; cacheSave();
  }catch(e){ mode='offline'; toast('مش قادر يوصل للسيرفر، بعرض آخر نسخة'); }
  setStatus(); render();
  if(mode==='db') syncNovenera();
}
/* ================= Novenera: teachers' student numbers ================= */
// Renewal day reached → the number saved that morning (doesn't change afterwards); otherwise live.
let NOV = {teachers:[], at:null, err:false, busy:false};
const NOV_KEYS = ['center_total','center_frozen','center_active','online_total','online_frozen','online_active','billable'];
async function syncNovenera(force){
  if(NOV.busy) return; NOV.busy=true;
  try{
    const linked = S.clients.filter(c=>c.noveneraTeacherId);
    const days = {};
    linked.forEach(c=>{ if(c.cycle!=='once' && c.nextDue && c.nextDue<=today()) days[c.noveneraTeacherId]=c.nextDue; });
    const {data, error} = await sb.functions.invoke('novenera-counts', {body:{days}});
    if(error || !data?.teachers) throw error||new Error('bad');
    NOV = {teachers:data.teachers, at:data.at, err:false, busy:true};
    for(const c of linked){
      const t = data.teachers.find(x=>x.id===c.noveneraTeacherId); if(!t) continue;
      const due = days[c.noveneraTeacherId];
      const pick = (due && t.on_day) ? t.on_day : t.live;
      const counts = {...Object.fromEntries(NOV_KEYS.map(k=>[k, n(pick[k])])), day: due && t.on_day ? t.on_day.day : today(),
        saved: !!(due && t.on_day && t.on_day.saved), missing: !!due && !t.on_day, live_billable: n(t.live?.billable), at: data.at};
      const old = c.novCounts || {};
      const same = NOV_KEYS.every(k=>n(old[k])===counts[k]) && old.day===counts.day && !!old.saved===counts.saved && n(old.live_billable)===counts.live_billable;
      if(!same || n(c.students)!==counts.billable) await save('clients', {...c, students:counts.billable, novCounts:counts}, true);
    }
    if(force) toast('الأعداد اتحدثت من نوفينيرا');
  }catch(e){ NOV.err=true; if(force) toast('مش قادر أوصل لنوفينيرا دلوقتي'); }
  finally{ NOV.busy=false; render(); }
}
function novBox(c){
  const k=c.novCounts, cfg=kcfg(c);
  const dayTxt = k.missing ? 'مفيش رقم متسجل يوم '+fdate(k.day)+'، ده الرقم الحالي' : k.saved ? 'رقم يوم التجديد '+fdate(k.day)+' (اتحفظ الصبح)' : 'الأرقام دلوقتي';
  const online = n(k.online_total)>0;
  const formula = online
    ? `سنتر <span class="num">${n(k.center_active)}</span> × ${fmt(c.price)} + أونلاين <span class="num">${n(k.online_active)}</span> × ${fmt(onlineRate(c))}`
    : `<span class="num">${n(k.billable)}</span> ${cfg.unit} × ${fmt(c.price)}`;
  return `<div class="nov"><div class="nh"><b>من نوفينيرا</b><small>${dayTxt}</small></div>
    <div class="n3"><div><span>كل الطلبة</span><b class="num">${n(k.center_total)+n(k.online_total)}</b></div>
    <div><span>متجمدين</span><b class="num">${n(k.center_frozen)+n(k.online_frozen)}</b></div>
    <div class="act"><span>العدد الفعلي</span><b class="num">${n(k.billable)}</b></div></div>
    <div class="nf"><span>${formula}${k.day!==today()&&n(k.live_billable)!==n(k.billable)?` · دلوقتي <span class="num">${n(k.live_billable)}</span>`:''}</span>
    <button type="button" class="btn sm" id="novRefresh">تحديث</button></div></div>`;
}
async function save(col, item, quiet){
  const id = item.id || uid();
  const rec = {...item, id};
  const arr = S[col]; const i = arr.findIndex(x=>x.id===id);
  const prev = i>=0 ? arr[i] : null;
  if(i>=0) arr[i] = rec; else arr.push(rec);
  render();
  const {error} = await sb.from(col).upsert(toRow(rec));
  if(error){ if(prev) S[col][S[col].findIndex(x=>x.id===id)]=prev; else S[col]=S[col].filter(x=>x.id!==id); render(); toast('تعذّر الحفظ'); return null; }
  cacheSave(); if(!quiet) toast('اتحفظ'); return rec;
}
async function remove(col, id){
  const prev = S[col]; S[col] = prev.filter(x=>x.id!==id);
  if(col==='clients') S.payments = S.payments.filter(p=>p.clientId!==id);
  if(col==='reps'){ S.rep_payouts = S.rep_payouts.filter(p=>p.repId!==id); S.clients = S.clients.map(c=>c.repId===id?{...c,repId:null}:c); }
  render();
  const {error} = await sb.from(col).delete().eq('id', id);
  if(error){ S[col]=prev; render(); toast('تعذّر الحذف'); return; }
  cacheSave(); toast('اتحذف');
}

function addMonths(s,k){ const d=parseD(s), day=d.getDate(); const t=new Date(d.getFullYear(), d.getMonth()+k, 1); const last=new Date(t.getFullYear(), t.getMonth()+1, 0).getDate(); t.setDate(Math.min(day,last)); return iso(t); }
function addCycle(s, cycle, k=1){

  if(cycle==='monthly') return addMonths(s,k);

}

/* Google Calendar reminder link */
function gcalUrl({title, date, time, details, recur}){
  const ymd = date.replace(/-/g,'');
  let dates;
  if(time){ const [h,m]=time.split(':').map(Number); const end=new Date(2000,0,1,h,m+30);
    dates = `${ymd}T${pad(h)}${pad(m)}00/${ymd}T${pad(end.getHours())}${pad(end.getMinutes())}00`; }
  else { const d=parseD(date); d.setDate(d.getDate()+1); dates = `${ymd}/${iso(d).replace(/-/g,'')}`; }
  const q = new URLSearchParams({action:'TEMPLATE', text:title, dates, details:details||'', ctz:'Africa/Cairo'});
  if(recur) q.set('recur', 'RRULE:'+recur);
  return 'https://calendar.google.com/calendar/render?'+q.toString();

/* amount in Arabic words for invoices */
function tafqeet(num){
  num = Math.round(n(num));
  if(num===0) return 'صفر';
  const ones=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
  const tens=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
  const hundreds=['','مائة','مائتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
  const below1000 = x => { const h=Math.floor(x/100), r=x%100, parts=[];
    if(h) parts.push(hundreds[h]);
    if(r){ if(r<20) parts.push(ones[r]); else { const o=r%10, t=Math.floor(r/10); parts.push(o? `${ones[o]} و${tens[t]}` : tens[t]); } }
    return parts.join(' و'); };
  const scale = (x, one, two, few, many) => x===1?one : x===2?two : x<=10?`${below1000(x)} ${few}` : `${below1000(x)} ${many}`;
  const m=Math.floor(num/1e6), th=Math.floor((num%1e6)/1000), r=num%1000, parts=[];
  if(m) parts.push(scale(m,'مليون','مليونان','ملايين','مليون'));
  if(th) parts.push(scale(th,'ألف','ألفان','آلاف','ألف'));
  if(r) parts.push(below1000(r));
  return parts.join(' و');
}

const kcfg = c => KIND_CFG[c.kind] || KIND_CFG.other;
const perUnit = c => c.billing==='per_student' && !!kcfg(c).unit;
/* teachers linked to Novenera: students come from the system (all − frozen); online-only students can have their own price */
const novLinked = c => !!c.noveneraTeacherId && perUnit(c) && !!c.novCounts;
const onlineRate = c => c.onlinePrice===null || c.onlinePrice===undefined || c.onlinePrice==='' ? n(c.price) : n(c.onlinePrice);
const hasOnlinePrice = c => novLinked(c) && n(c.novCounts.online_active)>0 && onlineRate(c)!==n(c.price);
const cycleAmount = c => !perUnit(c) ? n(c.fixedAmount)
  : novLinked(c) ? n(c.price)*n(c.novCounts.center_active) + onlineRate(c)*n(c.novCounts.online_active)
  : n(c.price)*n(c.students);
const ex = c => c.extra || {};
const paidBy = id => S.payments.filter(p=>p.clientId===id).reduce((a,p)=>a+n(p.amount),0);
function clientDesc(c){
  const e=ex(c), k=c.kind;
  const bits = k==='teacher'?[e.subject,e.stage] : k==='center'?[e.address] : k==='doctor'?[e.specialty,e.clinic] : [e.activity];
  return bits.filter(Boolean).join(' · ');
}
function clientState(c){
  const amt = cycleAmount(c);
  if(c.active===false) return {k:'off', txt:'موقوف', cls:'', owed:0, d:null};
  if(c.cycle==='once'){
    const rest = Math.max(0, amt - paidBy(c.id));
    if(rest<=0) return {k:'done', txt:'اتسدد', cls:'good', owed:0, d:null};
    const d = daysUntil(c.nextDue);
    if(d!==null && d<0) return {k:'late', txt:relDay(d), cls:'bad', owed:rest, d};
    if(d===0) return {k:'today', txt:'مستحق النهارده', cls:'warn', owed:rest, d};
    return {k:'ok', txt: d!==null ? relDay(d) : 'لسه', cls:'', owed:rest, d};
  }
  const d = daysUntil(c.nextDue);
  if(d===null) return {k:'ok', txt:'من غير ميعاد', cls:'', owed:0, d};
  if(d<0){ const len = c.cycle==='weekly'?7:30; const k = Math.floor((-d-1)/len)+1; return {k:'late', txt:relDay(d), cls:'bad', owed:k*amt, d, cycles:k}; }
  if(d===0) return {k:'today', txt:'مستحق النهارده', cls:'warn', owed:amt, d};
  if(d<=2) return {k:'soon', txt:relDay(d), cls:'warn', owed:0, d};
  return {k:'ok', txt:relDay(d), cls:'', owed:0, d};
}
/* sales commissions come out of the company's 20% */
function clientCommissions(c){
  if(c.entity==='pvt' || !c.repId || !c.commissionType || !n(c.commissionValue)) return [];
  const pays = S.payments.filter(p=>p.clientId===c.id).sort(byDateAsc);
  if(!pays.length) return [];
  const v = n(c.commissionValue), base = {clientId:c.id, repId:c.repId, entity:c.entity, client:c.name};
  if(c.commissionType==='once_fixed') return [{...base, date:pays[0].date, amount:v, payAmount:n(pays[0].amount), rate:null, kind:'مبلغ ثابت مرة واحدة'}];
  if(c.commissionType==='once_percent') return [{...base, date:pays[0].date, amount:n(pays[0].amount)*v/100, payAmount:n(pays[0].amount), rate:v, kind:'نسبة من أول دفعة'}];
  const cutoff = c.commissionMonths ? addMonths(pays[0].date, c.commissionMonths) : null;
  return pays.filter(p=>!cutoff || p.date < cutoff).map(p=>({...base, date:p.date, amount:n(p.amount)*v/100, payAmount:n(p.amount), rate:v, kind:'نسبة من الدفعة'}));
}
const allCommissions = () => S.clients.flatMap(clientCommissions);
function commText(c){
  if(!c.repId || !c.commissionType) return '';
  const v=n(c.commissionValue);
  if(c.commissionType==='once_fixed') return `${fmt(v)} ج.م مرة واحدة`;
  if(c.commissionType==='once_percent') return `${fmt(v)}% من أول دفعة`;
  return `${fmt(v)}% من كل دفعة${c.commissionMonths?` لمدة ${c.commissionMonths} ${c.commissionMonths<=10?'شهور':'شهر'}`:''}`;
}
function periodRange(p=period){
  const t=new Date();
  if(p==='month') return [iso(new Date(t.getFullYear(),t.getMonth(),1)), iso(new Date(t.getFullYear(),t.getMonth()+1,0))];
  if(p==='last') return [iso(new Date(t.getFullYear(),t.getMonth()-1,1)), iso(new Date(t.getFullYear(),t.getMonth(),0))];
  return null;
}
const inRange = (s,r) => !r || (!!s && s>=r[0] && s<=r[1]);
/* ================= the books =================
   Order of money: 1) income comes in  2) costs are paid first  3) only what's left is profit and gets split.
   Partners' money is kept in three separate drawers: advances (paid from their pocket, returned as-is),
   company profit, and the private pool (Fathy & Adel's old teachers). */
function pvtSplit(){ const s=settings().pvtSplit||{}; return {fathy:n(s.fathy??40)/100, adel:n(s.adel??40)/100, reserve:n(s.reserve??20)/100}; }
const poolOfEnt = e => e==='pvt' ? 'pvt' : 'company';
const poolOf = x => x.pool==='pvt' ? 'pvt' : 'company';
function books(){
  const cmap=Object.fromEntries(S.clients.map(c=>[c.id,c]));
  const K=[...EKEYS,'pvt'], rev=Object.fromEntries(K.map(k=>[k,0])), cost=Object.fromEntries(K.map(k=>[k,0]));
  let general=0;
  S.payments.forEach(p=>{ const c=cmap[p.clientId]; if(c && rev[c.entity]!==undefined) rev[c.entity]+=n(p.amount); });
  S.incomes.forEach(i=>{ if(rev[i.entity]!==undefined) rev[i.entity]+=n(i.amount); });
  S.expenses.forEach(e=>{ if(e.entity==='pvt') cost.pvt+=n(e.amount); else if(ENTS[e.entity]) cost[e.entity]+=n(e.amount); else general+=n(e.amount); });
  const revC=EKEYS.reduce((a,k)=>a+rev[k],0);
  const ent={};
  EKEYS.forEach(k=>{ const g=general*(revC>0?rev[k]/revC:1/EKEYS.length); ent[k]={rev:rev[k], own:cost[k], gen:g, cost:cost[k]+g, net:rev[k]-cost[k]-g}; });
  const costC=EKEYS.reduce((a,k)=>a+ent[k].cost,0), N=revC-costC;
  // a losing brand is covered by the others before anyone gets profit
  const pos=EKEYS.reduce((a,k)=>a+Math.max(0,ent[k].net),0), kf=N>0&&pos>0?N/pos:0;
  EKEYS.forEach(k=>ent[k].dist=Math.max(0,ent[k].net)*kf);
  const commTotal=allCommissions().reduce((a,x)=>a+x.amount,0);
  const repPaid=S.rep_payouts.reduce((a,x)=>a+n(x.amount),0);
  const reserveGross=EKEYS.reduce((a,k)=>a+ent[k].dist*ENTS[k].split.company,0);
  const ps=pvtSplit(), Np=rev.pvt-cost.pvt, distP=Math.max(0,Np);
  const p={};
  PKEYS.forEach(k=>{
    const byEnt=Object.fromEntries(EKEYS.map(e=>[e, ent[e].dist*(ENTS[e].split[k]||0)]));
    const inPvt=PVT_PARTNERS.includes(k);
    const earnedC=EKEYS.reduce((a,e)=>a+byEnt[e],0), earnedP=inPvt?distP*(ps[k]||0):0;
    const adv={company:0,pvt:0}, advRet={company:0,pvt:0}, took={company:0,pvt:0};
    S.expenses.forEach(e=>{ if(e.paidBy===k) adv[poolOfEnt(e.entity)]+=n(e.amount); });
    S.payouts.forEach(x=>{ if(x.partner!==k) return; (x.kind==='advance'?advRet:took)[poolOf(x)]+=n(x.amount); });
    const advPaid=adv.company+adv.pvt, advBack=advRet.company+advRet.pvt;
    p[k]={byEnt, inPvt, earnedC, earnedP, adv, advRet, took, advPaid, advBack, advOwed:advPaid-advBack,
      profitC:earnedC-took.company, profitP:earnedP-took.pvt};
    p[k].total=p[k].advOwed+p[k].profitC+(inPvt?p[k].profitP:0);
  });
  const paidByPool = pool => S.expenses.filter(e=>e.paidBy==='company' && poolOfEnt(e.entity)===pool).reduce((a,e)=>a+n(e.amount),0);
  const outPool = pool => S.payouts.filter(x=>poolOf(x)===pool).reduce((a,x)=>a+n(x.amount),0);
  const sumP = f => PKEYS.reduce((a,k)=>a+f(p[k]),0);
  const loan = S.transfers.reduce((a,t)=>a+(t.direction==='to_pvt'?1:-1)*n(t.amount),0);   // what the private pool owes the company
  const company={rev:revC, cost:costC, general, net:N, deficit:N<0?-N:0, reserveGross, commTotal, repPaid,
    reserve:reserveGross-commTotal, repOwed:commTotal-repPaid,
    cash:revC-paidByPool('company')-outPool('company')-repPaid-loan, loanOut:loan,
    advOwed:sumP(x=>x.adv.company-x.advRet.company), profitOwed:sumP(x=>x.profitC),
    partnersEarned:sumP(x=>x.earnedC)};
  const pv={rev:rev.pvt, cost:cost.pvt, net:Np, deficit:Np<0?-Np:0, dist:distP, split:ps, reserve:distP*ps.reserve,
    cash:rev.pvt-paidByPool('pvt')-outPool('pvt')+loan, loanOwed:loan,
    advOwed:sumP(x=>x.adv.pvt-x.advRet.pvt), profitOwed:sumP(x=>x.inPvt?x.profitP:0)};
  return {ent, company, pv, p};
}
function flow(range){
  const cmap=Object.fromEntries(S.clients.map(c=>[c.id,c])); const f={rc:0,rp:0,ec:0,ep:0};
  S.payments.forEach(p=>{ if(!inRange(p.date,range)) return; const c=cmap[p.clientId]; if(!c) return; if(c.entity==='pvt') f.rp+=n(p.amount); else f.rc+=n(p.amount); });
  S.incomes.forEach(i=>{ if(!inRange(i.date,range)) return; if(i.entity==='pvt') f.rp+=n(i.amount); else f.rc+=n(i.amount); });
  S.expenses.forEach(e=>{ if(!inRange(e.date,range)) return; if(e.entity==='pvt') f.ep+=n(e.amount); else f.ec+=n(e.amount); });
  return f;
}
function repSummary(id, range){
  const comms = allCommissions().filter(x=>x.repId===id);
  const earned = comms.reduce((a,x)=>a+x.amount,0);
  const paid = S.rep_payouts.filter(x=>x.repId===id).reduce((a,x)=>a+n(x.amount),0);
  const inPeriod = comms.filter(x=>inRange(x.date,range)).reduce((a,x)=>a+x.amount,0);
  return {earned, paid, balance:earned-paid, inPeriod, clients:S.clients.filter(c=>c.repId===id)};
}
function attention(){
  const items=[];
  S.clients.forEach(c=>{ const st=clientState(c); if(st.k==='late'||st.k==='today') items.push({type:'client', c, st, d:st.d??0}); });
  S.subscriptions.filter(s=>s.active!==false).forEach(s=>{ const d=daysUntil(s.nextDate); if(d!==null && d<=n(s.remindDays||3)) items.push({type:'sub', s, d}); });
  S.tasks.filter(t=>!t.done && t.dueDate).forEach(t=>{ const d=daysUntil(t.dueDate); if(d<=1) items.push({type:'task', t, d}); });
  return items.sort((a,b)=>a.d-b.d);
}

  const t=it.t;
  return `<div class="row"><button type="button" class="check" data-done="${t.id}" aria-label="خلصت"><svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg></button><button type="button" class="tap" data-open="task:${t.id}"><div class="main"><div class="t">${esc(t.title)}</div><div class="s">${fdate(t.dueDate)}${t.dueTime?' · '+t.dueTime:''}</div></div>
    <div class="amt"><span class="chip ${it.d<0?'bad':'warn'}">${relDay(it.d)}</span></div></button></div>`;
}

    </article>`:''}

    <article class="card">

      ${wl('دخل الشركة', mf.rc)}${wl('مصروفات الشركة', mf.ec)}${wl('الصافي', mf.rc-mf.ec, 'tot'+(mf.rc-mf.ec<0?' neg':''))}
      ${pvtActive?wl('دخل الحساب الخاص', mf.rp, 'sub'):''}
    </article>

    ${ents?`<article class="card"><div class="ch"><h2>كل كيان لوحده</h2><p>صافي كل كيان من الأول بعد مصروفاته</p></div>${ents}</article>`:''}`;

function vClients(){
  const q = cliQ.trim();
  let list = S.clients.filter(c=> (cliKind==='all'||c.kind===cliKind) && (!q || (c.name||'').includes(q) || (c.phone||'').includes(q) || clientDesc(c).includes(q)));
  const st = c => clientState(c);
  if(cliSeg==='late') list = list.filter(c=>st(c).k==='late');
  if(cliSeg==='due') list = list.filter(c=>['today','soon'].includes(st(c).k));
  const rank = {late:0,today:1,soon:2,ok:3,done:4,off:5};
  list.sort((a,b)=> rank[st(a).k]-rank[st(b).k] || (st(a).d??999)-(st(b).d??999) || (a.name||'').localeCompare(b.name||'','ar'));
  const lateN = S.clients.filter(c=>st(c).k==='late').length, dueN = S.clients.filter(c=>['today','soon'].includes(st(c).k)).length;
  const head = `
    <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="cliSearch" type="search" placeholder="دوّر بالاسم أو الرقم أو المادة" value="${esc(cliQ)}"></div>
    <div class="seg" role="group">
      ${[['all','الكل ('+S.clients.length+')'],['late','متأخر ('+lateN+')'],['due','مستحق قريب ('+dueN+')'],['other','دخل آخر']].map(([k,l])=>`<button type="button" data-cseg="${k}" aria-pressed="${cliSeg===k}">${l}</button>`).join('')}
    </div>`;
  if(cliSeg==='other'){
    const rows=[...S.incomes].sort(byDate).map(i=>`<div class="row"><button type="button" class="tap" data-open="income:${i.id}">
      <div class="main"><div class="t">${esc(i.desc)} ${entChip(i.entity)}</div><div class="s">${fdateY(i.date)}</div></div><div class="amt"><b>${money(i.amount)}</b></div></button></div>`).join('');
    return head+`<div class="list">${rows||`<div class="empty"><b>مفيش دخل إضافي</b>أي فلوس داخلة للكيان من برا العملاء (مشروع، خدمة) سجّلها هنا.</div>`}</div>`;
  }
  const kinds = `<div class="chips" role="group">${Object.entries(KINDS_PL).map(([k,l])=>`<button type="button" data-kind="${k}" aria-pressed="${cliKind===k}">${l}</button>`).join('')}</div>`;
  return head+kinds+`<div class="list">${list.map(clientRow).join('') || (S.clients.length?`<div class="empty"><b>مفيش نتايج</b>جرّب فلتر تاني.</div>`:`<div class="empty"><b>مفيش عملاء لسه</b>اضغط «+ عميل» واختار مدرس أو سنتر أو دكتور.</div>`)}</div>`;
}

function vExp(){
  const seg = `<div class="seg" role="group">${[['all','الكل'],['adv','دفعها شريك'],['company','من خزنة الشركة']].map(([k,l])=>`<button type="button" data-eseg="${k}" aria-pressed="${expSeg===k}">${l}</button>`).join('')}</div>`;
  let list=[...S.expenses].sort(byDate);
  if(expSeg==='adv') list=list.filter(e=>e.paidBy!=='company');
  if(expSeg==='company') list=list.filter(e=>e.paidBy==='company');

    const adv=e.paidBy!=='company';
    const tag = adv ? `<span class="chip warn">دفعها ${PARTNERS[e.paidBy]} من جيبه · سلفة</span>` : '';
    return `<div class="row"><button type="button" class="tap" data-open="expense:${e.id}">
      <div class="main"><div class="t">${esc(e.desc)} ${entChip(e.entity)}</div><div class="s">${esc(e.cat||'')} · ${fdateY(e.date)}</div>${tag?`<div style="margin-top:4px">${tag}</div>`:''}</div>
      <div class="amt"><b>${money(e.amount)}</b></div></button></div>`;

  return seg+`<div class="sec-h"><h2>${list.length} بند</h2><small>الإجمالي ${money(total)}</small></div>
    <div class="list">${rows||`<div class="empty"><b>${expSeg==='adv'?'مفيش مصروفات دفعها شريك':'مفيش مصروفات'}</b>${expSeg==='adv'?'لما شريك يدفع حاجة من جيبه، اختار اسمه في «مين دفع».':'المصروفات المتكررة زي ميتا و n8n ضيفها في «المواعيد ← التجديدات».'}</div>`}</div>
    <p class="hint">المصروفات بتتخصم من الدخل الأول، واللي يفضل هو الربح اللي بيتقسم. أي مصروف دفعه شريك من جيبه بيتسجل سلفة ليه، وبترجعله من «الفريق ← رد سلفة».</p>`;
}

function vDates(){
  const seg = `<div class="seg" role="group">${[['subs','التجديدات ('+S.subscriptions.length+')'],['tasks','المهام ('+S.tasks.filter(t=>!t.done).length+')']].map(([k,l])=>`<button type="button" data-dseg="${k}" aria-pressed="${dateSeg===k}">${l}</button>`).join('')}</div>`;
  if(dateSeg==='subs'){
    const list=[...S.subscriptions].sort((a,b)=>(a.active===false)-(b.active===false)||(a.nextDate||'').localeCompare(b.nextDate||''));
    const monthly = S.subscriptions.filter(s=>s.active!==false).reduce((a,s)=>a+n(s.amount)/(s.cycle==='yearly'?12:s.cycle==='quarterly'?3:1),0);
    const rows=list.map(s=>{ const d=daysUntil(s.nextDate), off=s.active===false;
      const cls = off?'':d<0?'bad':d<=n(s.remindDays||3)?'warn':'';
      return `<div class="row"><button type="button" class="tap" data-open="sub:${s.id}">
        <div class="main"><div class="t">${esc(s.name)} ${entChip(s.entity)}</div><div class="s">${SUB_CYCLES[s.cycle]} · ${fdateY(s.nextDate)}${s.paidBy!=='company'?' · يدفعه '+PARTNERS[s.paidBy]:''}</div></div>
        <div class="amt"><b>${money(s.amount)}</b><span class="chip ${cls}">${off?'موقوف':relDay(d)}</span></div></button></div>`; }).join('');
    return seg+`<div class="sec-h"><h2>الاشتراكات والتجديدات</h2><small>≈ ${money(monthly)} في الشهر</small></div>
      <div class="list">${rows||`<div class="empty"><b>مفيش تجديدات</b>ضيف اشتراك ميتا والراوتر والمنصات و n8n بميعاد التجديد.</div>`}</div>
      <p class="hint">من جوه أي اشتراك تقدر تضيف تذكير متكرر على Google Calendar يرن على موبايلك قبل الميعاد.</p>`;
  }
  const open=S.tasks.filter(t=>!t.done).sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999'));
  const done=S.tasks.filter(t=>t.done).sort((a,b)=>(b.dueDate||'').localeCompare(a.dueDate||'')).slice(0,15);
  const row=t=>{ const d=daysUntil(t.dueDate); const cls=t.done?'':d===null?'':d<0?'bad':d<=1?'warn':'';
    return `<div class="row ${t.done?'done':''}"><button type="button" class="check ${t.done?'on':''}" data-done="${t.id}" aria-label="${t.done?'رجّعها':'خلصت'}"><svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg></button>
      <button type="button" class="tap" data-open="task:${t.id}"><div class="main"><div class="t">${esc(t.title)} ${t.entity&&t.entity!=='general'?entChip(t.entity):''}</div>
      <div class="s">${t.dueDate?fdateY(t.dueDate)+(t.dueTime?' · '+t.dueTime:''):'من غير ميعاد'}${t.note?' · '+esc(t.note):''}</div></div>
      ${!t.done&&t.dueDate?`<div class="amt"><span class="chip ${cls}">${relDay(d)}</span></div>`:''}</button></div>`; };
  return seg+`<div class="list">${open.map(row).join('')||`<div class="empty"><b>مفيش مهام</b>اكتب أي حاجة المفروض تعملها قدام بميعادها.</div>`}</div>
    ${done.length?`<div class="sec-h"><h2>اتعملت</h2><small>${done.length}</small></div><div class="list">${done.map(row).join('')}</div>`:''}`;
}

  exp:['مصروف',()=>openForm('expense')],
  dates:['',()=>dateSeg==='subs'?openForm('sub'):openForm('task')],
  team:['',()=>teamSeg==='reps'?openForm('rep'):openForm('payout',null,{kind:'profit'})],
};
function render(){
  const v=document.getElementById('view');
  const focusSearch = document.activeElement?.id==='cliSearch';
  v.innerHTML=`<div class="pane">${tab==='home'?vHome():tab==='clients'?vClients():tab==='exp'?vExp():tab==='dates'?vDates():vTeam()}</div>`;
  if(focusSearch){ const i=document.getElementById('cliSearch'); i.focus(); i.setSelectionRange(i.value.length,i.value.length); }
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-current', b.dataset.tab===tab?'page':'false'));
  document.getElementById('fabLbl').textContent = tab==='dates' ? (dateSeg==='subs'?'تجديد':'مهمة') : tab==='team' ? (teamSeg==='reps'?'سيلز':'صرف') : tab==='clients'&&cliSeg==='other' ? 'دخل' : FAB[tab][0];
  const late=S.clients.filter(c=>clientState(c).k==='late').length;
  const dueDates=attention().filter(a=>a.type!=='client').length;
  const b1=document.getElementById('bClients'), b2=document.getElementById('bDates');
  b1.hidden=!late; b1.textContent=late; b2.hidden=!dueDates; b2.textContent=dueDates;
  const d=new Date(); document.getElementById('todayLbl').textContent=`${AR_DAYS[d.getDay()]} ${d.getDate()} ${AR_MONTHS[d.getMonth()]}`;
}

/* ================= sheets ================= */
const opt=(map,sel)=>Object.entries(map).map(([k,v])=>`<option value="${esc(k)}"${String(k)===String(sel??'')?' selected':''}>${esc(v)}</option>`).join('');
const entMap=Object.fromEntries(EKEYS.map(k=>[k,ENTS[k].name]));
const entMapG={general:'عام (كل كيانات الشركة)',...entMap, pvt:PVT.full};
const entMapC={...entMap, pvt:PVT.full};
const payerMap={company:'خزنة الشركة',...PARTNERS};
function sheet(html, onMount){
  const root=document.getElementById('sheetRoot');
  root.innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog"><div class="grab"></div>${html}</div></div>`;
  root.querySelector('#scrim').addEventListener('click',e=>{ if(e.target.id==='scrim') closeSheet(); });
  onMount && onMount(root);
}
function closeSheet(){ document.getElementById('sheetRoot').innerHTML=''; }
function delFlow(root, col, id, back, warn=''){
  root.querySelector('#delBtn').onclick=()=>{
    root.querySelector('#acts').innerHTML=`<div class="confirm"><span>متأكد إنك عايز تحذفه؟${warn}</span><button type="button" class="btn sm dan" id="yesDel">احذف</button><button type="button" class="btn sm" id="noDel">لا</button></div>`;
    root.querySelector('#noDel').onclick=back;
    root.querySelector('#yesDel').onclick=()=>{ closeSheet(); remove(col,id); };
  };
}
const v$=(root,s)=>root.querySelector(s)?.value;
function required(root){ const r=[...root.querySelectorAll('[required]')].find(x=>!x.closest('[hidden]') && !String(x.value).trim()); if(r){ r.focus(); toast('كمّل البيانات المطلوبة'); return false; } return true; }

/* ---- Novenera link in the client form ---- */
function novOptions(sel){
  const list = NOV.teachers.length ? NOV.teachers : (sel ? [{id:sel, name:'المدرس المربوط'}] : []);
  return list.map(t=>`<option value="${t.id}"${t.id===sel?' selected':''}>${esc(t.name)}${t.billing_exempt?' (مش بيتحاسب)':''}</option>`).join('');
}
function novFormFields(root, d){
  const sel = root.querySelector('#f_nov'); if(!sel) return {};
  const tid = sel.value || null, op = root.querySelector('#f_oprice').value;
  let counts = null;
  if(tid){
    if(d.noveneraTeacherId===tid && d.novCounts) counts = d.novCounts;
    else { const t = NOV.teachers.find(x=>x.id===tid); if(t?.live) counts = {...Object.fromEntries(NOV_KEYS.map(k=>[k, n(t.live[k])])), day:today(), saved:false, live_billable:n(t.live.billable)}; }
  }
  return {noveneraTeacherId: tid, onlinePrice: op==='' ? null : n(op), novCounts: counts, ...(counts?{students:counts.billable}:{})};
}

/* ---- client form: fields change with the client type ---- */

  const d = draft || (item ? {...item, extra:{...ex(item)}} : {kind:'teacher', entity:'nov', cycle:'monthly', nextDue:today(), extra:{}});
  const cfg = KIND_CFG[d.kind] || KIND_CFG.other;
  if(!cfg.billings.includes(d.billing)) d.billing = cfg.billings[0];
  const e = d.extra||{};
  const services = [...new Set([...SERVICES, ...S.clients.map(c=>ex(c).service).filter(Boolean)])];
  const kindField = f => f.opts
    ? `<label class="fl">${f.l}<select data-x="${f.k}">${f.opts.map(o=>`<option${o===(e[f.k]||'')?' selected':''} value="${esc(o)}">${o||'—'}</option>`).join('')}</select></label>`
    : `<label class="fl">${f.l}<input data-x="${f.k}" value="${esc(e[f.k]||'')}" placeholder="${esc(f.ph||'')}"></label>`;
  const reps = S.reps.filter(r=>r.active!==false || r.id===d.repId);
  const billMap = Object.fromEntries(cfg.billings.map(b=>[b, b==='fixed'?'مبلغ ثابت':`بعدد ${cfg.units}`]));
  sheet(`<h3>${item?'تعديل '+esc(item.name):'عميل جديد'}</h3><p class="sub">اختار النوع الأول، والخانات هتتغير على حسبه</p>
    <form id="frm" novalidate><div class="fields">
      <div class="kindpick" role="group" aria-label="نوع العميل">${Object.entries(KIND_CFG).map(([k,v])=>`<button type="button" data-k="${k}" aria-pressed="${d.kind===k}">${ICONS[k]}${v.label}</button>`).join('')}</div>
      <label class="fl">الاسم<input id="f_name" required value="${esc(d.name||'')}" placeholder="${esc(cfg.namePh)}"></label>
      <div class="f2">${cfg.fields.map(kindField).join('')}</div>
      <div class="f2"><label class="fl">الكيان<select id="f_entity">${opt(entMapC,d.entity||'nov')}</select></label>
      <label class="fl">رقم الموبايل (واتساب)<input id="f_phone" type="tel" inputmode="tel" dir="ltr" style="text-align:right" value="${esc(d.phone||'')}" placeholder="01xxxxxxxxx"></label></div>
      <label class="fl">الخدمة / السيستم<input id="f_service" list="svcList" value="${esc(e.service||'')}" placeholder="مثلاً: منصة تعليمية"><datalist id="svcList">${services.map(s=>`<option value="${esc(s)}">`).join('')}</datalist></label>
      <div class="group"><p class="gh">الدفع</p>
        <div class="f2"><label class="fl">بيدفع<select id="f_cycle">${opt(CYCLES,d.cycle||'monthly')}</select></label>
        ${cfg.billings.length>1?`<label class="fl">الحساب<select id="f_billing">${opt(billMap,d.billing)}</select></label>`:`<input type="hidden" id="f_billing" value="fixed">`}</div>
        <div class="f2" id="perUnit"><label class="fl">سعر ${cfg.unit||'الوحدة'}<input id="f_price" type="number" inputmode="decimal" step="any" min="0" value="${d.price??''}"></label>
        <label class="fl">عدد ال${cfg.units||'وحدات'}<input id="f_students" type="number" inputmode="numeric" min="0" value="${d.students??''}"></label></div>
        ${d.kind==='teacher'?`<div id="novWrap" class="fields">
          <label class="fl">ربط بحسابه على نوفينيرا<select id="f_nov"><option value="">مش مربوط (العدد بيتكتب بالإيد)</option>${novOptions(d.noveneraTeacherId)}</select></label>
          ${!NOV.teachers.length?`<p class="hint">${NOV.err?'مش قادر أوصل لنوفينيرا دلوقتي، جرب تاني بعد شوية.':'بحمّل قائمة المدرسين من نوفينيرا...'}</p>`:''}
          <label class="fl" id="opriceWrap">سعر طالب الأونلاين بس<input id="f_oprice" type="number" inputmode="decimal" step="any" min="0" value="${d.onlinePrice??''}" placeholder="فاضي = نفس سعر السنتر"></label>
          <p class="hint" id="novHint">العدد بيتملي لوحده من نوفينيرا: كل الطلبة ناقص المتجمدين، ويوم التجديد بيتثبت رقم الصبح.</p>
        </div>`:''}
        <label class="fl" id="fixedWrap">المبلغ<input id="f_fixed" type="number" inputmode="decimal" step="any" min="0" value="${d.fixedAmount??''}"></label>
        <div class="calc"><span id="calcLbl">قيمة الدفعة</span><b id="f_total"></b></div>
        <label class="fl"><span id="dueLbl">ميعاد الدفعة الجاية</span><input id="f_due" type="date" value="${d.nextDue||today()}"></label>
      </div>
      <div class="group" id="repGroup"><p class="gh">السيلز <small>مين جاب العميل ده؟</small></p>
        ${S.reps.length?`<label class="fl">السيلز<select id="f_rep"><option value="">مفيش (جه مباشر)</option>${opt(Object.fromEntries(reps.map(r=>[r.id,r.name])), d.repId)}</select></label>
        <div id="commWrap" class="fields">
          <label class="fl">طريقة العمولة<select id="f_ctype">${opt(COMM_TYPES,d.commissionType||'recurring_percent')}</select></label>
          <div class="f2"><label class="fl"><span id="cvalLbl">النسبة %</span><input id="f_cval" type="number" inputmode="decimal" step="any" min="0" value="${d.commissionValue||''}"></label>
          <label class="fl" id="cmonthsWrap">لمدة<select id="f_cmonths">${opt({'':'طول ما هو مشترك',1:'شهر واحد',3:'3 شهور',6:'6 شهور',12:'سنة'},d.commissionMonths??'')}</select></label></div>
          <div class="calc"><span>العمولة من الدفعة دي</span><b id="f_comm"></b></div>
        </div>`:`<p class="hint">ضيف السيلز الأول من تاب «الفريق ← السيلز».</p>`}
      </div>
      <label class="fl">ملاحظات<input id="f_note" value="${esc(d.note||'')}" placeholder="اختياري"></label>
      ${item?`<label class="cb"><input type="checkbox" id="f_active"${d.active===false?'':' checked'}> شغال معانا (شيلها لو وقف التعامل)</label>`:''}
    </div>
    <div class="acts" id="acts"><button type="submit" class="btn pri grow">حفظ</button>${item?'<button type="button" class="btn dan" id="delBtn">حذف</button>':''}<button type="button" class="btn" id="cancelBtn">إلغاء</button></div></form>`, root=>{
    const $=s=>root.querySelector(s);
    const collect=()=>({...(item||{}), ...d, name:$('#f_name').value, entity:$('#f_entity').value, phone:$('#f_phone').value.trim(),
      cycle:$('#f_cycle').value, billing:$('#f_billing').value, price:n($('#f_price').value), students:n($('#f_students').value), fixedAmount:n($('#f_fixed').value),
      ...novFormFields(root, d),
      nextDue:$('#f_due').value||null, note:$('#f_note').value.trim(), active: $('#f_active') ? $('#f_active').checked : (d.active??true),
      extra:{...Object.fromEntries([...root.querySelectorAll('[data-x]')].map(i=>[i.dataset.x, i.value.trim()])), service:$('#f_service').value.trim()},
      repId: $('#f_entity').value==='pvt' ? null : $('#f_rep') ? ($('#f_rep').value||null) : (d.repId||null),
      commissionType: $('#f_entity').value!=='pvt' && $('#f_rep')?.value ? $('#f_ctype').value : null,
      commissionValue: $('#f_rep')?.value ? n($('#f_cval').value) : 0,
      commissionMonths: $('#f_rep')?.value && $('#f_ctype').value==='recurring_percent' && $('#f_cmonths').value ? n($('#f_cmonths').value) : null});
    root.querySelectorAll('.kindpick button').forEach(b=>b.onclick=()=>{ const cur=collect(); cur.kind=b.dataset.k; openClientForm(id, cur); root.querySelector('#f_name')?.focus(); });
    const upd=()=>{ const fixed=$('#f_billing').value==='fixed'; $('#perUnit').hidden=fixed; $('#fixedWrap').hidden=!fixed;
      const nv=novFormFields(root, d); const linked=!fixed && !!nv.noveneraTeacherId && !!nv.novCounts;
      if($('#novWrap')){ $('#novWrap').hidden=fixed; $('#opriceWrap').hidden=!nv.noveneraTeacherId; $('#novHint').hidden=!nv.noveneraTeacherId; }
      $('#f_students').readOnly=linked; if(linked) $('#f_students').value=nv.novCounts.billable;
      const amt= fixed ? n($('#f_fixed').value) : linked ? cycleAmount({...d, kind:d.kind, billing:'per_student', price:n($('#f_price').value), ...nv})
        : n($('#f_price').value)*n($('#f_students').value);
      const once=$('#f_cycle').value==='once';
      $('#calcLbl').textContent = once ? 'المبلغ الإجمالي' : $('#f_cycle').value==='weekly' ? 'قيمة الدفعة الأسبوعية' : 'قيمة الدفعة الشهرية';
      $('#dueLbl').textContent = once ? 'ميعاد الدفع' : 'ميعاد الدفعة الجاية';
      $('#f_total').innerHTML=money(amt);
      if($('#repGroup')) $('#repGroup').hidden = $('#f_entity').value==='pvt';
      if($('#f_rep')){ const on=!!$('#f_rep').value; $('#commWrap').hidden=!on;
        const t=$('#f_ctype').value; $('#cmonthsWrap').hidden=t!=='recurring_percent'; $('#cvalLbl').textContent = t==='once_fixed'?'المبلغ (ج.م)':'النسبة %';
        const cv=n($('#f_cval').value); $('#f_comm').innerHTML = money(t==='once_fixed'?cv:amt*cv/100);
        $('#f_comm').previousElementSibling.textContent = t==='once_fixed'?'العمولة (مرة واحدة)':t==='once_percent'?'العمولة (مرة واحدة)':'العمولة من كل دفعة'; } };
    root.querySelectorAll('input,select').forEach(el=>{ el.addEventListener('input',upd); el.addEventListener('change',upd); }); upd();
    $('#cancelBtn').onclick = item ? ()=>openClient(id) : closeSheet;
    if(item) delFlow(root, 'clients', id, ()=>openClientForm(id), ' هيتمسح معاه سجل دفعاته.');
    if(!item && !draft) setTimeout(()=>$('#f_name')?.focus(),80);
    $('#frm').onsubmit=async ev=>{
      ev.preventDefault(); if(!required(root)) return;
      const rec=collect(); rec.name=rec.name.trim(); rec.createdAt=item?.createdAt||Date.now(); delete rec.collected;
      if(rec.repId && !n(rec.commissionValue)){ toast('اكتب نسبة أو مبلغ العمولة'); $('#f_cval').focus(); return; }
      const relink = (item?.noveneraTeacherId||null)!==(rec.noveneraTeacherId||null);
      const saved=await save('clients', rec); if(saved){ openClient(saved.id); if(relink && rec.noveneraTeacherId){ await syncNovenera(); if(document.querySelector('.scrim')) openClient(saved.id); } }
    };
  });
}

/* ================= PDF documents ================= */
/* Documents are drawn by the browser itself (SVG foreignObject → canvas), so Arabic shaping is exact,
   then packed into a PDF by a tiny built-in writer — no outside libraries. */
let fontCssP=null;
function embeddedFontCss(){
  if(fontCssP) return fontCssP;
  fontCssP=(async()=>{
    try{
      const css=await (await fetch('https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;700&display=swap')).text();
      const blocks=css.split('/*').slice(1).map(x=>'/*'+x).filter(x=>/\/\*\s*(arabic|latin)\s*\*\//.test(x));
      const out=await Promise.all(blocks.map(async blk=>{
        const m=blk.match(/url\((https:[^)]+)\)/); if(!m) return '';
        const buf=await (await fetch(m[1])).arrayBuffer();
        let bin=''; const u=new Uint8Array(buf); for(let i=0;i<u.length;i+=0x8000) bin+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));
        return blk.replace(m[1],'data:font/woff2;base64,'+btoa(bin));
      }));
      return out.join('\n');
    }catch(e){ fontCssP=null; return ''; }
  })();
  return fontCssP;
}
async function docToJpeg(el, css){
  const SCALE=2, W=794, H=1123;
  const xhtml=new XMLSerializer().serializeToString(el);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W*SCALE}" height="${H*SCALE}" viewBox="0 0 ${W} ${H}"><foreignObject x="0" y="0" width="${W}" height="${H}"><div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="width:${W}px;height:${H}px"><style>${css}</style>${xhtml}</div></foreignObject></svg>`;
  const img=new Image(); img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  await img.decode();
  await new Promise(r=>setTimeout(r,30));
  const cv=document.createElement('canvas'); cv.width=W*SCALE; cv.height=H*SCALE;
  const ctx=cv.getContext('2d'); ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,cv.width,cv.height); ctx.drawImage(img,0,0,cv.width,cv.height);
  const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.9));
  return {bytes:new Uint8Array(await blob.arrayBuffer()), w:cv.width, h:cv.height, url:cv.toDataURL('image/jpeg',0.7)};
}
function jpegsToPdf(imgs){
  const enc=new TextEncoder(), parts=[], off=[]; let len=0;
  const push=x=>{ const b=typeof x==='string'?enc.encode(x):x; parts.push(b); len+=b.length; };
  const obj=(num,fn)=>{ off[num]=len; push(`${num} 0 obj\n`); fn(); push('\nendobj\n'); };
  push('%PDF-1.4\n');
  obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>push(`<< /Type /Pages /Count ${imgs.length} /Kids [${imgs.map((_,i)=>`${3+3*i} 0 R`).join(' ')}] >>`));
  imgs.forEach((im,i)=>{ const p=3+3*i, cs=`q 595.28 0 0 841.89 0 0 cm /Im${i} Do Q`;
    obj(p,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im${i} ${p+2} 0 R >> >> /Contents ${p+1} 0 R >>`));
    obj(p+1,()=>push(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
    obj(p+2,()=>{ push(`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`); push(im.bytes); push('\nendstream'); });
  });
  const size=3+3*imgs.length, xref=len;
  push(`xref\n0 ${size}\n0000000000 65535 f \n`);
  for(let k=1;k<size;k++) push(String(off[k]).padStart(10,'0')+' 00000 n \n');
  push(`trailer\n<< /Size ${size} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts,{type:'application/pdf'});
}

function ledger(entries, range){
  const sorted=[...entries].sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.order||0)-(b.order||0));
  const start = range?.[0];
  let opening=0; const rows=[]; let bal=0; let credit=0, debit=0;
  sorted.forEach(e=>{ if(start && e.date<start){ opening+=e.credit-e.debit; } });
  bal=opening;
  sorted.forEach(e=>{ if(!inRange(e.date,range)) return; bal+=e.credit-e.debit; credit+=e.credit; debit+=e.debit; rows.push({...e, bal}); });
  return {opening, rows, credit, debit, closing:bal};
}
