    const pages=[...host.querySelectorAll('.doc')], imgs=[];
    for(const pg of pages) imgs.push(await docToJpeg(pg, css));
    return {blob:jpegsToPdf(imgs), preview:imgs[0].url, pages:imgs.length};
  } finally { host.remove(); }
}
async function makeDoc(build, {name, phone, text, back}){
  sheet(`<h3>بجهّز الملف…</h3><p class="sub">ثواني</p>`);
  let out;
  try{ out = await renderPdf(build()); }
  catch(e){ console.error(e); sheet(`<h3>معرفتش أعمل الملف</h3><p class="sub">اتأكد إن النت شغال وجرّب تاني.</p><div class="acts"><button type="button" class="btn grow" id="bk">رجوع</button></div>`, r=>r.querySelector('#bk').onclick=back||closeSheet); return; }
  const fname = (name||'sahm').replace(/[\\/:*?"<>|\s]+/g,'-')+'.pdf';
  const file = new File([out.blob], fname, {type:'application/pdf'});
  const canShare = !!(navigator.canShare && navigator.canShare({files:[file]}));
  sheet(`<h3>الملف جاهز</h3><p class="sub">${esc(fname)} · ${out.pages>1?out.pages+' صفحات':'صفحة واحدة'}</p>
    <div class="preview"><img src="${out.preview}" alt="معاينة الصفحة الأولى"></div>
    <div class="tools col">
      ${canShare?`<button type="button" class="btn wa" id="shareBtn">${WA_SVG} ابعته (اختار واتساب)</button>`:''}
      ${!canShare&&phone?`<a class="btn wa" id="waBtn" href="${waUrl(phone,text)}" target="_blank" rel="noopener">${WA_SVG} افتح شات واتساب وأرفق الملف</a>`:''}
      <button type="button" class="btn ${canShare?'':'pri'}" id="dlBtn">${PDF_SVG} نزّل PDF</button>
      ${text?`<button type="button" class="btn" id="copyBtn">انسخ نص الرسالة</button>`:''}
    </div>
    ${!canShare&&phone?'<p class="hint" style="margin-top:8px">نزّل الملف الأول، وبعدين افتح الشات وأرفقه.</p>':''}
    <div class="acts"><button type="button" class="btn grow" id="bk">رجوع</button></div>`, r=>{
    const dl=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(out.blob); a.download=fname; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1500); };
    r.querySelector('#dlBtn').onclick=dl;
    r.querySelector('#bk').onclick=back||closeSheet;
    r.querySelector('#shareBtn')?.addEventListener('click', async()=>{ try{ await navigator.share({files:[file], text:text||'', title:fname}); }catch(e){ if(e?.name!=='AbortError') dl(); } });
    r.querySelector('#copyBtn')?.addEventListener('click', async()=>{ try{ await navigator.clipboard.writeText(text); toast('اتنسخ'); }catch(_){ toast('مقدرتش أنسخ'); } });
  });
}
function invoiceFlow(pid, back, fresh){
  const p=S.payments.find(x=>x.id===pid); if(!p) return back?.();
  const c=S.clients.find(x=>x.id===p.clientId);
  if(!p.invoiceNo){ p.invoiceNo = S.payments.reduce((a,x)=>Math.max(a,n(x.invoiceNo)),0)+1; save('payments',p,true); }
  const text=fillTpl(settings().tpl.receipt, {...clientVars(c), 'المبلغ':fmt(p.amount), 'التاريخ':fdateY(p.date), 'رقم_الفاتورة':invNo(p,c)});
  const go=()=>makeDoc(()=>docInvoice(pid), {name:`فاتورة-${invNo(p,c)}`, phone:c.phone, text, back});
  if(!fresh) return go();
  sheet(`<h3>اتسجلت ✅</h3><p class="sub">${money(p.amount)} من ${esc(c.name)} · ${invNo(p,c)}</p>
    <div class="tools col"><button type="button" class="btn pri" id="invBtn">${PDF_SVG} اعمل فاتورة PDF وابعتها</button>
    ${c.phone?`<a class="btn wa" href="${waUrl(c.phone,text)}" target="_blank" rel="noopener">${WA_SVG} ابعت تأكيد استلام بس</a>`:''}</div>
    <div class="acts"><button type="button" class="btn grow" id="okBtn">تمام</button></div>`, r=>{ r.querySelector('#invBtn').onclick=go; r.querySelector('#okBtn').onclick=back||closeSheet; });
}
function statementFlow(kind, id){
  if(kind==='partner'){
    const name=PARTNERS[id], res=docPartnerStatement(id);
    const text=fillTpl(settings().tpl.statement,{'الاسم':name,'الكيان':brand('group').name,'الفترة':'من البداية حتى '+fdateY(today()),'المبلغ':fmt(res.total)});
    return makeDoc(()=>res.html, {name:`كشف-حساب-${name}`, phone:res.phone, text, back:closeSheet});
  }
  let per='month';
  const name = kind==='partner'?PARTNERS[id]:repName(id);
  const back = kind==='rep' ? ()=>openRep(id) : closeSheet;
  const draw=()=>sheet(`<h3>كشف حساب ${esc(name)}</h3><p class="sub">اختار الفترة</p>
    <div class="seg" role="group">${[['month','الشهر ده'],['last','الشهر اللي فات'],['all','من الأول']].map(([k,l])=>`<button type="button" data-per="${k}" aria-pressed="${per===k}">${l}</button>`).join('')}</div>
    <div class="acts"><button type="button" class="btn pri grow" id="goBtn">${PDF_SVG} اعمل الكشف</button><button type="button" class="btn" id="bk">رجوع</button></div>`, r=>{
      r.querySelectorAll('[data-per]').forEach(b=>b.onclick=()=>{ per=b.dataset.per; draw(); });
      r.querySelector('#bk').onclick=back;
      r.querySelector('#goBtn').onclick=()=>{
        const res=docLedgerStatement(kind,id,per);
        const text=fillTpl(settings().tpl.statement,{'الاسم':name,'الكيان':brand('group').name,'الفترة':periodLabel(per),'المبلغ':fmt(res.L.closing)});
        makeDoc(()=>res.html, {name:`كشف-حساب-${name}-${per==='all'?'كامل':periodLabel(per)}`, phone:res.phone, text, back:draw});
      };
    });
  draw();
}

/* ---- settings ---- */
let setSeg='brand';
function resizeLogo(file){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{
    const s=Math.min(1, 320/Math.max(img.width,img.height)); const cv=document.createElement('canvas'); cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); res(cv.toDataURL('image/png')); }; img.onerror=rej; img.src=r.result; }; r.onerror=rej; r.readAsDataURL(file); });
}
function openSettings(draft){
  const s=draft||settings();
  const keys=['group',...EKEYS];
  const bname = k => k==='group'?'الشركة الأم (كشوف الشركاء والسيلز)':ENTS[k].name;
  const brandBlock = k => { const b={...brand(k), ...(s.brands?.[k]||{})};
    return `<div class="group"><p class="gh">${bname(k)}</p>
      <div class="logo-edit"><div class="logo-box" style="${b.logo?`background-image:url('${b.logo}')`:`background-color:${k==='group'?GROUP_HEX:ENTS[k].hex}`}">${b.logo?'':esc((b.name||'?').charAt(0))}</div>
        <div class="tools"><label class="btn sm" for="lg_${k}">${b.logo?'غيّر الشعار':'ارفع الشعار'}</label><input type="file" id="lg_${k}" accept="image/*" hidden data-logo="${k}">
        ${b.logo?`<button type="button" class="btn sm dan" data-rmlogo="${k}">شيله</button>`:''}</div></div>
      <div class="f2"><label class="fl">الاسم في الفواتير<input data-b="${k}.name" value="${esc(b.name)}"></label>
      <label class="fl">رقم التواصل<input data-b="${k}.phone" type="tel" dir="ltr" style="text-align:right" value="${esc(b.phone)}"></label></div>
      <label class="fl">العنوان / الموقع<input data-b="${k}.address" value="${esc(b.address)}" placeholder="اختياري"></label>
      <label class="fl">جملة آخر الفاتورة<input data-b="${k}.note" value="${esc(b.note)}" placeholder="شكراً لثقتكم"></label></div>`; };
  const body = setSeg==='brand' ? `<p class="hint">الشعار والبيانات دي بتظهر في الفواتير وكشوف الحساب.</p>${keys.map(brandBlock).join('')}`
    : setSeg==='msgs' ? `<p class="hint">تقدر تستخدم: ${TPL_VARS}. والنجمتين *كده* بتخلي الكلام عريض في واتساب.</p>
      <label class="fl">تذكير قبل الميعاد<textarea id="t_remind">${esc(s.tpl.remind)}</textarea></label>
      <label class="fl">إشعار تأخير<textarea id="t_late">${esc(s.tpl.late)}</textarea></label>
      <label class="fl">تأكيد استلام دفعة<textarea id="t_receipt">${esc(s.tpl.receipt)}</textarea></label>
      <label class="fl">إرسال كشف حساب<textarea id="t_statement">${esc(s.tpl.statement)}</textarea></label>
      <button type="button" class="btn sm" id="resetTpl">رجّع الرسايل الأصلية</button>`
    : setSeg==='partners' ? `<div class="group"><p class="gh">${PVT.full} <small>تقسيم أرباح المدرسين القدام</small></p>
        <div class="f2" style="grid-template-columns:repeat(3,minmax(0,1fr))"><label class="fl">فتحي %<input id="sp_fathy" type="number" inputmode="decimal" min="0" max="100" value="${n(s.pvtSplit?.fathy??40)}"></label>
        <label class="fl">عادل %<input id="sp_adel" type="number" inputmode="decimal" min="0" max="100" value="${n(s.pvtSplit?.adel??40)}"></label>
        <label class="fl">احتياطي %<input id="sp_reserve" type="number" inputmode="decimal" min="0" max="100" value="${n(s.pvtSplit?.reserve??20)}"></label></div>
        <p class="hint">لازم المجموع يبقى 100. لو عايزينها نص بنص اكتب 50 و50 و0.</p></div>
      <p class="hint">أرقام الشركاء عشان تبعتلهم كشوف الحساب.</p><div class="f2">${PKEYS.map(k=>`<label class="fl">${PARTNERS[k]}<input id="ph_${k}" type="tel" dir="ltr" style="text-align:right" value="${esc(s.phones?.[k]||'')}" placeholder="01xxxxxxxxx"></label>`).join('')}</div>`
    : `<div class="tools col"><button type="button" class="btn" id="exportBtn">تنزيل نسخة احتياطية</button>
      <label class="btn" for="importFile">استيراد نسخة</label><input type="file" id="importFile" accept=".json,application/json" hidden>
      <button type="button" class="btn dan" id="logoutBtn">تسجيل خروج</button></div>`;
  sheet(`<h3>الإعدادات</h3>
    <div class="seg" role="group" style="margin:10px 0 14px">${[['brand','الهوية'],['msgs','الرسايل'],['partners','الشركاء'],['data','البيانات']].map(([k,l])=>`<button type="button" data-sseg="${k}" aria-pressed="${setSeg===k}">${l}</button>`).join('')}</div>
    <form id="frm" novalidate><div class="fields">${body}</div>
    ${setSeg!=='data'?`<div class="acts"><button type="submit" class="btn pri grow">حفظ</button><button type="button" class="btn" id="cancelBtn">إلغاء</button></div>`:''}</form>`, root=>{
    const $=q=>root.querySelector(q);
    const collect=()=>{ const out={...s, brands:JSON.parse(JSON.stringify(s.brands||{})), tpl:{...s.tpl}, phones:{...(s.phones||{})}};
      root.querySelectorAll('[data-b]').forEach(i=>{ const [k,f]=i.dataset.b.split('.'); out.brands[k]={...(out.brands[k]||{}), [f]:i.value.trim()}; });
      ['remind','late','receipt','statement'].forEach(k=>{ if($('#t_'+k)) out.tpl[k]=$('#t_'+k).value; });
      if($('#sp_fathy')) out.pvtSplit={fathy:n($('#sp_fathy').value), adel:n($('#sp_adel').value), reserve:n($('#sp_reserve').value)};
      PKEYS.forEach(k=>{ if($('#ph_'+k)){ const v=$('#ph_'+k).value.trim(); if(v) out.phones[k]=v; else delete out.phones[k]; } });
      return out; };
    root.querySelectorAll('[data-sseg]').forEach(b=>b.onclick=()=>{ const cur=collect(); setSeg=b.dataset.sseg; openSettings(cur); });
    root.querySelectorAll('[data-logo]').forEach(i=>i.onchange=async()=>{ const f=i.files[0]; if(!f) return; try{ const url=await resizeLogo(f); const cur=collect(); cur.brands[i.dataset.logo]={...(cur.brands[i.dataset.logo]||{}), logo:url}; openSettings(cur); }catch(_){ toast('الصورة دي مش شغالة'); } });
    root.querySelectorAll('[data-rmlogo]').forEach(b=>b.onclick=()=>{ const cur=collect(); cur.brands[b.dataset.rmlogo]={...(cur.brands[b.dataset.rmlogo]||{}), logo:''}; openSettings(cur); });
    $('#cancelBtn')?.addEventListener('click',closeSheet);
    $('#resetTpl')?.addEventListener('click',()=>{ ['remind','late','receipt','statement'].forEach(k=>$('#t_'+k).value=DEFAULT_TPL[k]); });
    $('#exportBtn')?.addEventListener('click',exportData);
    $('#importFile')?.addEventListener('change',e=>{ if(e.target.files[0]) importData(e.target.files[0]); });
    $('#logoutBtn')?.addEventListener('click',async()=>{ await sb.auth.signOut(); try{localStorage.removeItem(LS_KEY);}catch(_){}; location.reload(); });
    $('#frm').onsubmit=async e=>{ e.preventDefault(); const out=collect();
      const tpl={}; Object.keys(DEFAULT_TPL).forEach(k=>{ if(out.tpl[k] && out.tpl[k]!==DEFAULT_TPL[k]) tpl[k]=out.tpl[k]; });
      if(out.pvtSplit && Math.abs(out.pvtSplit.fathy+out.pvtSplit.adel+out.pvtSplit.reserve-100)>0.01){ toast('مجموع نسب الحساب الخاص لازم يبقى 100'); return; }
      const value={...(S.settings.find(x=>x.id==='main')?.value||{}), phones:out.phones, brands:out.brands, tpl, ...(out.pvtSplit?{pvtSplit:out.pvtSplit}:{})};
      if(await save('settings',{id:'main', value})) closeSheet(); };
  });
}

let tt; function toast(msg){ clearTimeout(tt); document.querySelector('.toast')?.remove(); const el=document.createElement('div'); el.className='toast'; el.textContent=msg; document.body.appendChild(el); tt=setTimeout(()=>el.remove(),1900); }

/* ================= events ================= */
document.querySelector('nav.tabs').addEventListener('click',e=>{ const b=e.target.closest('button[data-tab]'); if(!b) return; tab=b.dataset.tab; try{localStorage.setItem('tab',tab);}catch(_){}; render(); window.scrollTo(0,0); });
document.getElementById('view').addEventListener('click',async e=>{
  const t=e.target.closest('[data-xfer],[data-xlist],[data-open],[data-period],[data-cseg],[data-kind],[data-eseg],[data-dseg],[data-tseg],[data-pay],[data-reppay],[data-stmt],[data-done]'); if(!t) return;
  const ds=t.dataset;
  if(ds.xfer) return openForm('transfer',null,{direction:ds.xfer});
  if(ds.xlist) return openTransfers();
  if(ds.open){ const [type,id]=ds.open.split(':'); if(type==='client') openClient(id); else if(type==='sub') openSub(id); else if(type==='task') openTask(id); else if(type==='rep') openRep(id); else openForm(type,id); return; }
  if(ds.period){ period=ds.period; return render(); }
  if(ds.cseg){ cliSeg=ds.cseg; return render(); }
  if(ds.kind){ cliKind=ds.kind; return render(); }
  if(ds.eseg){ expSeg=ds.eseg; return render(); }
  if(ds.dseg){ dateSeg=ds.dseg; return render(); }
  if(ds.tseg){ teamSeg=ds.tseg; return render(); }
  if(ds.pay){ const [partner,kind]=ds.pay.split(':'); return openForm('payout',null,{partner, kind:kind||'profit'}); }
  if(ds.reppay) return openForm('reppay',null,{repId:ds.reppay});
  if(ds.stmt){ const [k,id]=ds.stmt.split(':'); return statementFlow(k,id); }
  if(ds.done){ const tk=S.tasks.find(x=>x.id===ds.done); if(tk){ await save('tasks',{...tk, done:!tk.done}, true); toast(tk.done?'رجعت':'برافو 👏'); } }
});
document.getElementById('view').addEventListener('input',e=>{ if(e.target.id==='cliSearch'){ cliQ=e.target.value; render(); } });
document.getElementById('fab').onclick=()=>FAB[tab][1]();
document.getElementById('settingsBtn').onclick=()=>openSettings();

function exportData(){
  const data=JSON.stringify({app:'sahm', exportedAt:new Date().toISOString(), ...S},null,2);
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));
  a.download=`sahm-backup-${today()}.json`; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
}
async function importData(file){
  let d; try{ d=JSON.parse(await file.text()); }catch(e){ toast('الملف ده مش نسخة احتياطية صالحة'); return; }
  if(d.teachers && !d.clients) d.clients=d.teachers;
  let count=0;
  for(const c of ['reps',...COLS.filter(x=>x!=='reps')]){ const rows=(d[c]||[]).filter(x=>x&&x.id).map(x=>{ const r={...x}; delete r.collected; return toRow(r); }); if(!rows.length) continue;
    const {error}=await sb.from(c).upsert(rows); if(error){ toast('مشكلة في الاستيراد: '+error.message); return; } count+=rows.length; }
  toast(`اتستورد ${count} بند`); closeSheet(); loadAll();
}

/* ================= auth & boot ================= */
function showAuth(msg){ document.getElementById('appShell').hidden=true; document.getElementById('auth').hidden=false; if(msg) document.getElementById('authMsg').textContent=msg; }
document.getElementById('authForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const email=document.getElementById('a_email').value.trim(), password=document.getElementById('a_pass').value;
  const signup=e.submitter&&e.submitter.id==='signupBtn'; const msg=document.getElementById('authMsg');
  if(!email||!password){ msg.textContent='اكتب الإيميل وكلمة السر الأول'; return; }
  if(password.length<6){ msg.textContent='كلمة السر لازم تكون 6 حروف على الأقل'; return; }
  msg.textContent='لحظة...';
  const r=signup?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
  if(r.error){ msg.textContent=/confirm/i.test(r.error.message)?'لازم تأكد الإيميل الأول':/Invalid login/i.test(r.error.message)?'الإيميل أو كلمة السر غلط':r.error.message; return; }
  if(signup&&!r.data.session){ msg.textContent='اتعمل الحساب. اضغط «دخول» بنفس البيانات.'; return; }
  start();
});
async function start(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ showAuth(); return; }
  document.getElementById('auth').hidden=true; document.getElementById('appShell').hidden=false;
  cacheLoad(); render(); loadAll();
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && mode!=='loading' && !document.querySelector('.scrim')) loadAll(); });
start();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
